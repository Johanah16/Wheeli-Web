<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResVita AI Brain</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #001A33; overflow: hidden; }
  body { font-family: 'Montserrat', sans-serif; color: #fff; display: grid; place-items: center; }

  /* The design is drawn at 1920x1080 and scaled to fit whatever box it's embedded in */
  #fit { position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: radial-gradient(ellipse 60% 65% at 58% 52%, #0A3C86 0%, #04265A 45%, #001A33 100%); }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center; }
  .grid { position: absolute; inset: -400px; opacity: .07;
    background-image: linear-gradient(#66B3FF 1px, transparent 1px), linear-gradient(90deg, #66B3FF 1px, transparent 1px);
    background-size: 60px 60px; animation: drift 60s linear infinite; }
  @keyframes drift { to { transform: translate(60px, 60px); } }
  svg { position: absolute; inset: 0; overflow: visible; }

  .logo { position: absolute; left: 64px; top: 52px; }
  .logo img { height: 64px; display: block; }
  .logo span { display: block; margin-top: 4px; font-size: 19px; font-weight: 500; letter-spacing: .04em; }
  h1 { position: absolute; left: 64px; top: 190px; font-size: 64px; font-weight: 800; line-height: 1; text-transform: uppercase; letter-spacing: -.01em; }
  h1 b { color: #3399FF; display: block; }
  .sub { position: absolute; left: 64px; top: 340px; width: 420px; font-size: 22px; line-height: 1.4; color: #CCE6FF; }
  .stats { position: absolute; left: 64px; top: 470px; display: grid; gap: 22px; }
  .stat b { display: block; font-size: 54px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 15px; font-weight: 600; letter-spacing: .16em; color: #66B3FF; text-transform: uppercase; }
  .legend { position: absolute; left: 64px; bottom: 56px; display: grid; grid-template-columns: repeat(2, auto); gap: 10px 36px; font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .legend div { cursor: default; transition: opacity .3s; }
  .legend i { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 10px; vertical-align: -1px; }
  .crumbs { position: absolute; right: 64px; top: 66px; font-size: 18px; font-weight: 600; letter-spacing: .18em; }
  .crumbs i { color: #0080FF; font-style: normal; padding: 0 10px; }
  .hint { position: absolute; right: 64px; bottom: 40px; font-size: 13px; font-weight: 600; letter-spacing: .14em; color: rgba(204,230,255,.55); text-transform: uppercase; }

  /* intro: copy slides in */
  .in { opacity: 0; transform: translateY(18px); transition: opacity .8s ease, transform .8s ease; }
  .on .in { opacity: 1; transform: none; }

  text { font-family: 'Montserrat', sans-serif; paint-order: stroke; stroke: #001A33; stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
  .node { cursor: pointer; }
  .node circle, .link, .node text { transition: opacity .35s ease; }
  .dim .node:not(.hot) circle { opacity: .18; }
  .dim .node:not(.hot) text { opacity: .12; }
  .dim .link:not(.hot) { opacity: .06; }
  .node.hot text { opacity: 1 !important; }
  @media (prefers-reduced-motion: reduce) { .grid { animation: none; } .in { transition: none; } }
</style>
</head>

:"Jobs"},{"source":"Harbour View Deck","target":"Quoting Agent"},{"source":"Harbour View Deck","target":"Reviews Agent"},{"source":"Harbour View Deck","target":"Safety Agent"},{"source":"Harbour View Deck","target":"Scheduling Agent"},{"source":"Hiring Agent","target":"Seek"},{"source":"Hiring Agent","target":"Team Roster"},{"source":"Hiring Agent","target":"The Brain (Model)"},{"source":"Hiring Agent","target":"how-i-onboard"},{"source":"Hiring Agent","target":"how-i-write-job-ads"},{"source":"Invoicing Agent","target":"Mitchell Bathroom"},{"source":"Invoicing Agent","target":"Smith St Reno"},{"source":"Invoicing Agent","target":"Terms and Conditions"},{"source":"Invoicing Agent","target":"The Brain (Model)"},{"source":"Invoicing Agent","target":"Xero"},{"source":"Invoicing Agent","target":"how-i-chase-invoices"},{"source":"Job Handover Agent","target":"Mitchell Bathroom"},{"source":"Job Handover Agent","target":"The Brain (Model)"},{"source":"Job Handover Agent","target":"how-i-hand-over-jobs"},{"source":"Job Templates","target":"Quoting Agent"},{"source":"Job Templates","target":"Safety Agent"},{"source":"Job Templates","target":"how-i-hand-over-jobs"},{"source":"Job Templates","target":"how-i-onboard"},{"source":"Job Templates","target":"how-i-write-swms"},{"source":"Jobs","target":"Mitchell Bathroom"},{"source":"Jobs","target":"Parker Extension"},{"source":"Jobs","target":"Smith St Reno"},{"source":"Jobs","target":"Westside Fit-Out"},{"source":"Marketing Agent","target":"More Jobs Won"},{"source":"Marketing Agent","target":"Parker Extension"},{"source":"Marketing Agent","target":"The Brain (Model)"},{"source":"Marketing Agent","target":"how-i-post-socials"},{"source":"Memory","target":"The Desk (Context)"},{"source":"Mission","target":"ResVita"},{"source":"Mission","target":"Who We Serve"},{"source":"More Jobs Won","target":"Quoting Agent"},{"source":"More Jobs Won","target":"Results"},{"source":"Owner Time Back","target":"Results"},{"source":"Owner Time Back","target":"Weekly Numbers Agent"},{"source":"Parker Extension","target":"Quoting Agent"},{"source":"Partner","target":"ResVita"},{"source":"Pricing Book","target":"Quoting Agent"},{"source":"Pricing Book","target":"how-i-quote"},{"source":"Purpose","target":"ResVita"},{"source":"Quoting Agent","target":"ServiceM8"},{"source":"Quoting Agent","target":"Smith St Reno"},{"source":"Quoting Agent","target":"The Brain (Model)"},{"source":"Quoting Agent","target":"how-i-quote"},{"source":"ResVita","target":"ResVita AI Brain"},{"source":"ResVita","target":"Vision"},{"source":"ResVita","target":"Who We Serve"},{"source":"ResVita AI Brain","target":"The App (Harness)"},{"source":"ResVita AI Brain","target":"The Brain (Model)"},{"source":"ResVita AI Brain","target":"The Desk (Context)"},{"source":"Results","target":"Safer Sites"},{"source":"Reviews Agent","target":"The Brain (Model)"},{"source":"Reviews Agent","target":"how-i-ask-for-reviews"},{"source":"Safer Sites","target":"Safety Agent"},{"source":"Safety Agent","target":"The Brain (Model)"},{"source":"Safety Agent","target":"Westside Fit-Out"},{"source":"Safety Agent","target":"how-i-write-swms"},{"source":"Scheduling Agent","target":"Smith St Reno"},{"source":"Scheduling Agent","target":"Supplier List"},{"source":"Scheduling Agent","target":"Team Roster"},{"source":"Scheduling Agent","target":"The Brain (Model)"},{"source":"Scheduling Agent","target":"Westside Fit-Out"},{"source":"Scheduling Agent","target":"how-i-schedule"},{"source":"ServiceM8","target":"Weekly Numbers Agent"},{"source":"Skills Library","target":"The App (Harness)"},{"source":"Skills Library","target":"how-i-ask-for-reviews"},{"source":"Skills Library","target":"how-i-chase-invoices"},{"source":"Skills Library","target":"how-i-follow-up"},{"source":"Skills Library","target":"how-i-hand-over-jobs"},{"source":"Skills Library","target":"how-i-onboard"},{"source":"Skills Library","target":"how-i-post-socials"},{"source":"Skills Library","target":"how-i-quote"},{"source":"Skills Library","target":"how-i-reply"},{"source":"Skills Library","target":"how-i-report-weekly"},{"source":"Skills Library","target":"how-i-schedule"},{"source":"Skills Library","target":"how-i-write-job-ads"},{"source":"Skills Library","target":"how-i-write-swms"},{"source":"Supplier List","target":"how-i-schedule"},{"source":"Team Roster","target":"how-i-onboard"},{"source":"Team Roster","target":"how-i-schedule"},{"source":"Terms and Conditions","target":"how-i-chase-invoices"},{"source":"Terms and Conditions","target":"how-i-quote"},{"source":"The App (Harness)","target":"The Brain (Model)"},{"source":"The Brain (Model)","target":"Weekly Numbers Agent"},{"source":"Weekly Numbers Agent","target":"Westside Fit-Out"},{"source":"Weekly Numbers Agent","target":"Xero"},{"source":"Weekly Numbers Agent","target":"how-i-report-weekly"}]};
const LEGEND = [["00 Hub","AI Brain"],["02 The Engine","The engine"],["03 Agents","Agents"],["04 Skills","Skills"],
  ["05 Business Knowledge","Knowledge"],["06 Jobs","Jobs"],["07 Connectors","Connectors"],["08 Results","Results"],
  ["01 ResVita","ResVita"],["09 Program","Program"]];
const ORDER = ['00 Hub', '02 The Engine', '03 Agents', '04 Skills', '05 Business Knowledge', '07 Connectors', '08 Results', '06 Jobs', '01 ResVita', '09 Program'];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const W = 1920, H = 1080;

// ---- fit the 1920x1080 stage to the frame ----
const fit = () => {
  const s = Math.min(innerWidth / W, innerHeight / H);
  document.getElementById('stage').style.transform = `translate(-50%, -50%) scale(${s})`;
};
addEventListener('resize', fit); fit();

// ---- layout: brain in the middle, engine and agent rings, everything else in sectors ----
const data = structuredClone(DATA);
const deg = {}; data.links.forEach(l => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
data.nodes.forEach(n => { n.deg = deg[n.id] || 1; n.r = 4 + Math.sqrt(n.deg) * 3.4; });
const color = Object.fromEntries(data.nodes.map(n => [n.group, n.color]));
const hub = data.nodes.find(n => n.group === '00 Hub');
hub.r = 30; hub.deg = 99; hub.fx = 0; hub.fy = 0;
const RING = { '02 The Engine': 210, '03 Agents': 370 };
Object.entries(RING).forEach(([g, R], k) => {
  const ring = data.nodes.filter(n => n.group === g);
  ring.forEach((n, i) => { const a = (i / ring.length) * 2 * Math.PI + k * .35; n.fx = R * Math.cos(a); n.fy = R * Math.sin(a); });
});
const SECTOR = { '04 Skills': 180, '05 Business Knowledge': 231, '07 Connectors': 282, '08 Results': 333, '06 Jobs': 24, '01 ResVita': 75, '09 Program': 126 };
const OUTER = 560, rad = a => a * Math.PI / 180;
const sim = d3.forceSimulation(data.nodes)
  .force('link', d3.forceLink(data.links).id(d => d.id).distance(70).strength(.06))
  .force('charge', d3.forceManyBody().strength(-260))
  .force('collide', d3.forceCollide(d => d.r + (d.group === '04 Skills' || d.group === '07 Connectors' ? 52 : 38)).strength(1))
  .force('x', d3.forceX(d => SECTOR[d.group] != null ? OUTER * Math.cos(rad(SECTOR[d.group])) : 0).strength(d => SECTOR[d.group] != null ? .3 : 0))
  .force('y', d3.forceY(d => SECTOR[d.group] != null ? OUTER * Math.sin(rad(SECTOR[d.group])) : 0).strength(d => SECTOR[d.group] != null ? .3 : 0))
  .stop();
for (let i = 0; i < 1200; i++) sim.tick();
const xs = d3.extent(data.nodes, n => n.x), ys = d3.extent(data.nodes, n => n.y);
const X0 = 680, X1 = W - 110, Y0 = 150, Y1 = H - 70;
data.nodes.forEach((n, i) => {
  n.bx = X0 + (n.x - xs[0]) / (xs[1] - xs[0]) * (X1 - X0);
  n.by = Y0 + (n.y - ys[0]) / (ys[1] - ys[0]) * (Y1 - Y0);
  n.x = n.bx; n.y = n.by;
  n.ph = i * 1.7; n.amp = n.group === '00 Hub' ? 0 : 3 + (i % 5);   // gentle float
});
const neighbours = new Map(data.nodes.map(n => [n.id, new Set([n.id])]));
data.links.forEach(l => { neighbours.get(l.source.id).add(l.target.id); neighbours.get(l.target.id).add(l.source.id); });

// ---- draw ----
const svg = d3.select('#g');
const defs = svg.append('defs');
const glow = defs.append('filter').attr('id', 'glow').attr('x', '-100%').attr('y', '-100%').attr('width', '300%').attr('height', '300%');
glow.append('feGaussianBlur').attr('stdDeviation', 6).attr('result', 'b');
const m = glow.append('feMerge'); m.append('feMergeNode').attr('in', 'b'); m.append('feMergeNode').attr('in', 'SourceGraphic');
const root = svg.append('g');
const big = l => l.source.deg > 9 || l.target.deg > 9;
const link = root.append('g').selectAll('line').data(data.links).join('line').attr('class', 'link')
  .attr('stroke', d => big(d) ? 'rgba(102,179,255,.42)' : 'rgba(102,179,255,.22)')
  .attr('stroke-width', d => big(d) ? 1.6 : 1.1);
const pulses = root.append('g');
const node = root.append('g').selectAll('g').data(data.nodes).join('g').attr('class', 'node');
const halo = node.filter(d => d.group === '00 Hub').append('circle').attr('r', d => d.r).attr('fill', 'none')
  .attr('stroke', '#3399FF').attr('stroke-width', 2);
node.append('circle').attr('class', 'dot').attr('r', d => d.r).attr('fill', d => d.color)
  .attr('filter', d => d.deg > 8 ? 'url(#glow)' : null)
  .attr('stroke', d => d.group === '00 Hub' ? '#0080FF' : 'none').attr('stroke-width', 4);
node.append('text').text(d => d.id)
  .attr('y', d => d.group === '00 Hub' ? -d.r - 14 : d.r + (d.deg > 8 ? 22 : 15))
  .attr('text-anchor', 'middle')
  .attr('font-size', d => d.group === '00 Hub' ? 26 : d.deg > 12 ? 19 : d.deg > 6 ? 14.5 : 11.5)
  .attr('font-weight', d => d.deg > 6 ? 700 : 500)
  .attr('fill', d => d.deg > 6 ? '#FFFFFF' : 'rgba(240,240,229,.78)');
node.filter(d => d.group === '00 Hub').raise();

// ---- hover: light up a node and everything it touches ----
const focus = id => {
  const set = neighbours.get(id);
  root.classed('dim', true);
  node.classed('hot', d => set.has(d.id));
  link.classed('hot', d => d.source.id === id || d.target.id === id);
};
const blur = () => { root.classed('dim', false); node.classed('hot', false); link.classed('hot', false); };
node.on('mouseenter', (e, d) => focus(d.id)).on('mouseleave', blur)
    .on('touchstart', (e, d) => { e.preventDefault(); focus(d.id); }, { passive: false });
svg.on('touchstart', e => { if (e.target.tagName === 'svg') blur(); });

// ---- legend + stats ----
document.getElementById('legend').innerHTML = LEGEND.map(([g, l]) => `<div data-g="${g}"><i style="background:${color[g]}"></i>${l}</div>`).join('');
document.querySelectorAll('.legend div').forEach(el => {
  el.addEventListener('mouseenter', () => { root.classed('dim', true); node.classed('hot', d => d.group === el.dataset.g); });
  el.addEventListener('mouseleave', blur);
});
const count = g => data.nodes.filter(n => n.group === g).length;
const STATS = [[count('03 Agents') - 1, 'AI agents'], [count('04 Skills') - 1, 'Written skills'], [count('07 Connectors') - 1, 'Connected tools'], [data.links.length, 'Connections']];
document.getElementById('stats').innerHTML = STATS.map(([, l]) => `<div class="stat"><b>0</b><span>${l}</span></div>`).join('');
const countUp = () => document.querySelectorAll('.stat b').forEach((b, i) => {
  const to = STATS[i][0], t0 = performance.now(), dur = 1600 + i * 200;
  const step = t => { const p = Math.min((t - t0) / dur, 1); b.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
});

// ---- intro: the brain builds itself ring by ring ----
const rank = n => ORDER.indexOf(n.group);
data.nodes.forEach(n => { n.born = Infinity; });
let started = false, T0 = 0;
function start() {
  if (started) return; started = true;
  document.getElementById('fit').classList.add('on');
  countUp();
  T0 = performance.now();
  let t = 300;
  ORDER.forEach(g => {
    const group = data.nodes.filter(n => n.group === g);
    group.forEach((n, i) => { n.born = REDUCED ? 0 : t + i * 45; });
    t += REDUCED ? 0 : 160 + group.length * 45;
  });
  requestAnimationFrame(frame);
}

// ---- running: float, ripple from the brain, and data pulses along the links ----
const live = [];
let lastPulse = 0;
function frame(now) {
  const t = now - T0;
  data.nodes.forEach(n => {
    const age = t - n.born, k = age < 0 ? 0 : Math.min(age / 600, 1), e = 1 - Math.pow(1 - k, 3);
    n.vis = e;
    const f = REDUCED ? 0 : n.amp;
    // fly out from the brain, then float
    n.x = hub.bx + (n.bx - hub.bx) * e + Math.sin(t / 1900 + n.ph) * f;
    n.y = hub.by + (n.by - hub.by) * e + Math.cos(t / 2300 + n.ph) * f;
  });
  node.attr('transform', d => `translate(${d.x},${d.y})`).style('opacity', d => d.vis);
  link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y)
      .style('opacity', d => Math.min(d.source.vis, d.target.vis));

  if (!REDUCED) {
    // brain heartbeat
    const beat = (t % 2400) / 2400;
    halo.attr('r', hub.r + beat * 46).attr('stroke-opacity', .8 * (1 - beat));
    // data pulses travel from busy nodes outwards
    if (t > 2500 && now - lastPulse > 140) {
      lastPulse = now;
      const l = data.links[Math.floor(Math.random() * data.links.length)];
      const flip = l.target.deg > l.source.deg;
      live.push({ a: flip ? l.target : l.source, b: flip ? l.source : l.target, t0: now, dur: 900 + Math.random() * 700,
        el: pulses.append('circle').attr('r', 3.2).attr('fill', '#CCE6FF').attr('filter', 'url(#glow)') });
    }
    for (let i = live.length - 1; i >= 0; i--) {
      const p = live[i], k = (now - p.t0) / p.dur;
      if (k >= 1) { p.el.remove(); live.splice(i, 1); continue; }
      p.el.attr('cx', p.a.x + (p.b.x - p.a.x) * k).attr('cy', p.a.y + (p.b.y - p.a.y) * k).attr('opacity', Math.sin(Math.PI * k));
    }
  }
  if (!REDUCED || t < 100) requestAnimationFrame(frame);
}

// start when it scrolls into view (or straight away if it's already on screen)
const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { start(); io.disconnect(); } }, { threshold: .25 });
io.observe(document.getElementById('fit'));
document.fonts && document.fonts.ready.then(fit);
</script>
